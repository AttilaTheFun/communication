name: CI
# A public repository's CI on GitHub's own runners (~/Developer/AGENTS.md):
# the package built and tested on Linux, in swift.org's image, on every pull
# request and every push to main. The Apple backend (LiveKit's WebRTC) is
# compile-gated to Apple's systems, so Linux builds Communication and
# CommunicationCore and runs their tests.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: swift test
