name: CI
# A public repository's CI on GitHub's own runners (~/Developer/AGENTS.md),
# on every pull request and every push to main: CWebRTC's bundle rebuilt
# from this commit (each variant's C loopback on its own runner) and checked
# against the one Package.swift names (`cwebrtc-bundle verify`: a manifest
# naming a bundle this commit doesn't reproduce fails), then the package
# built and tested on Linux over that bundle (`pin --path`), so CI never
# needs a release's asset before it's published (Docs/releasing.md). The
# Apple backend (LiveKit's WebRTC) is compile-gated to Apple's systems and
# is tested at release.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # LiveKit's libwebrtc, pinned by SHA-256 in Tools/cwebrtc_bundle/Sources/Pins.swift.
  LIVEKIT: webrtc-83af826

jobs:
  variant:
    strategy:
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: apt-get update -qq && apt-get install -y -qq curl unzip zip
      - name: The variant
        run: >-
          swift run --package-path Tools/cwebrtc_bundle cwebrtc-bundle variant
          --platform "$PLATFORM" --livekit "$LIVEKIT" --out .build/variants
      - name: CWebRTC's loopback
        run: |
          clang -O1 -ICWebRTC/include CWebRTC/test/loopback.c -o .build/loopback \
            -L".build/variants/$PLATFORM" -lcwebrtc -lpthread -lm -ldl
          timeout 120 .build/loopback
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: variant-${{ matrix.platform }}
          path: .build/variants
          retention-days: 1

  # Android's variants: the shim compiled against the NDK's sysroot and
  # libc++ (LiveKit's Android libwebrtc is built against it, std::__ndk1),
  # with clang's Android runtime from the NDK, on x86_64 (the NDK's own
  # tools are x86_64; the shim is compiled by the image's clang). Its C
  # loopback is linked as an Android executable here; it runs on a device
  # (Docs/platforms.md: Waydroid, by hand), not on GitHub's runners.
  variant-android:
    strategy:
      matrix:
        include:
          - { platform: android-arm64, target: aarch64-linux-android28 }
          - { platform: android-x64, target: x86_64-linux-android28 }
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    timeout-minutes: 60
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      # The NDK Swift's Android SDK sets up with, pinned by SHA-256.
      NDK: android-ndk-r27c
      NDK_SHA256: 59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: apt-get update -qq && apt-get install -y -qq curl unzip zip lld llvm
      - name: The NDK
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/$NDK-linux.zip"
          echo "$NDK_SHA256  $RUNNER_TEMP/ndk.zip" | sha256sum -c --quiet -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP" && rm "$RUNNER_TEMP/ndk.zip"
      - name: The variant
        run: >-
          swift run --package-path Tools/cwebrtc_bundle cwebrtc-bundle variant
          --platform "$PLATFORM" --livekit "$LIVEKIT" --ndk "$RUNNER_TEMP/$NDK" --out .build/variants
      - name: CWebRTC's loopback, linked for Android
        run: |
          prebuilt="$RUNNER_TEMP/$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          clang --target="$TARGET" --sysroot="$prebuilt/sysroot" -resource-dir "$(ls -d "$prebuilt"/lib/clang/* | head -1)" \
            -fuse-ld=lld -O1 -ICWebRTC/include CWebRTC/test/loopback.c -o .build/loopback \
            -L".build/variants/$PLATFORM" -lcwebrtc -llog -lc++_shared -lm -ldl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: variant-${{ matrix.platform }}
          path: .build/variants
          retention-days: 1

  # The bundle, as a release from this commit would carry it, compared with
  # Package.swift's. Its checksum is in the log and the zip is kept a day,
  # for a prepare pull request.
  bundle:
    needs: [variant, variant-android]
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: apt-get update -qq && apt-get install -y -qq zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: variant-*, path: .build/downloaded }
      - run: |
          swift build --package-path Tools/cwebrtc_bundle
          tool="$(swift build --package-path Tools/cwebrtc_bundle --show-bin-path)/cwebrtc-bundle"
          "$tool" assemble --version auto --out .build/CWebRTC.artifactbundle.zip .build/downloaded/*
          "$tool" verify --zip .build/CWebRTC.artifactbundle.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bundle, path: .build/CWebRTC.artifactbundle.zip, retention-days: 1 }

  linux:
    needs: bundle
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: apt-get update -qq && apt-get install -y -qq unzip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: bundle, path: .build }
      - name: Build, over this commit's bundle
        run: |
          unzip -q .build/CWebRTC.artifactbundle.zip -d .build/bundle
          swift run --package-path Tools/cwebrtc_bundle cwebrtc-bundle pin --path .build/bundle/CWebRTC.artifactbundle
          swift build --build-tests
      - name: Test
        run: swift test --skip-build
